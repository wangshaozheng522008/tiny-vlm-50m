[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minillm"
version = "0.1.0"
description = "An 86.5M-parameter Chinese-first decoder-only language model that quantises under 50 MB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "tokenizers>=0.15",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
minillm-train = "minillm.train:main"
minillm-sft = "minillm.sft:main"
minillm-generate = "minillm.generate:main"
minillm-quantize = "minillm.quantize:main"
minillm-evaluate = "minillm.evaluate:main"
minillm-web = "minillm.web:main"

[tool.setuptools.package-data]
minillm = ["web_assets/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
